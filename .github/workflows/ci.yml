name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Nessun segreto nel codice
        run: |
          if git grep -nE 'sb_secret_|-----BEGIN (RSA |EC )?PRIVATE KEY|eyJhbGciOi[A-Za-z0-9_-]{20,}' -- ':!.github/workflows/ci.yml'; then
            echo "Possibile segreto nel repository"; exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::formattazione da sistemare"
      - run: flutter analyze --fatal-infos
      - run: flutter test
      # La web app è la versione per iPhone: deve compilare a ogni modifica.
      - run: tool/build_web.sh

  edge-function:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Logica dell'invio dei promemoria Web Push.
      - run: deno test supabase/functions/invia-promemoria/logica_test.ts
      - run: deno check supabase/functions/invia-promemoria/index.ts
