name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: APK installabile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      # Firmato con la chiave di debug: si installa sul telefono ma non va
      # sul Play Store (serve la chiave di caricamento, dopo il nome).
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk zampa.apk
      # Versione leggera per i telefoni degli ultimi anni (arm64).
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk zampa-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zampa-android
          path: |
            zampa.apk
            zampa-arm64.apk
          retention-days: 30

  emulatore:
    name: Collaudo su emulatore (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Spazio su disco per l'emulatore
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby /usr/local/lib/node_modules /usr/share/swift \
            /usr/local/share/powershell /usr/share/miniconda /usr/local/julia* /opt/az \
            /opt/microsoft /opt/google /usr/local/share/chromium /opt/pipx || true
          sudo docker image prune -a -f || true
          df -h /
      - name: Accelerazione KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/android_itest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collaudo-android-log
          path: itest.log
          if-no-files-found: ignore
