<!DOCTYPE html>
<html lang="it">
<head>
  <!--
    Il base href si sceglie al momento della build:
      BASE_HREF=/pellovi/ tool/build_web.sh
    (deve iniziare e finire con "/"). Con la radice del dominio basta "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pellovi: la salute del tuo cane in un posto solo. Vaccini, antiparassitari, terapie, peso, pipì e cacca. I dati restano sul tuo dispositivo.">
  <meta name="theme-color" content="#F26B4F">
  <!--
    Solo script del nostro sito. Blocca anche lo script di Google che il
    plugin google_sign_in carica all'avvio: sul web l'accesso con Google passa
    dal reindirizzamento di Supabase, e così chi non usa l'account non contatta
    Google. Se Supabase usa un dominio personalizzato, aggiungerlo a connect-src.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' blob: data: https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com https://geocoding-api.open-meteo.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">

  <meta name="color-scheme" content="light dark">

  <!-- iPhone e iPad: app a schermo intero quando è sulla schermata Home -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pellovi">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Pellovi</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFF7F1; }
    @media (prefers-color-scheme: dark) { html, body { background: #14100E; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 600 20px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #B3361E;
    }
    @media (prefers-color-scheme: dark) { #splash { color: #FF8A6E; } }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash noscript { font-weight: 400; font-size: 16px; padding: 0 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <span>Pellovi si sta aprendo…</span>
    <noscript>Per usare Pellovi attiva JavaScript nel browser.</noscript>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Funziona offline: service worker di Pellovi (web/sw.js). Quello generato
    // da Flutter si disinstalla da solo e non è usato (web/flutter_bootstrap.js).
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Service worker non registrato:', e);
        });
      });
      // Dopo il primo disegno: salva per l'offline i file usati davvero.
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.ready.then(function (reg) {
          var url = performance.getEntriesByType('resource').map(function (e) {
            return e.name;
          });
          if (reg.active) reg.active.postMessage({ tipo: 'salva-usati', url: url });
        });
      });
    }
    // I dati stanno nel browser: chiede di non cancellarli quando manca
    // spazio (Safari e Chrome lo concedono di più alle app installate).
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
  </script>
</body>
</html>
