<!DOCTYPE html>
<html lang="it">
<head>
  <!--
    Il base href si sceglie al momento della build:
      BASE_HREF=/lulu/ tool/build_web.sh
    (deve iniziare e finire con "/"). Con la radice del dominio basta "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lulù: la salute del tuo cane in un posto solo. Vaccini, antiparassitari, terapie, peso, pipì e cacca. I dati restano sul tuo dispositivo.">
  <meta name="theme-color" content="#22406A">
  <meta name="color-scheme" content="light dark">

  <!-- iPhone e iPad: app a schermo intero quando è sulla schermata Home -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lulù">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Lulù</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F2F4EF; }
    @media (prefers-color-scheme: dark) { html, body { background: #0F1722; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 600 20px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #22406A;
    }
    @media (prefers-color-scheme: dark) { #splash { color: #A9C6F0; } }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash noscript { font-weight: 400; font-size: 16px; padding: 0 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <span>Lulù si sta aprendo…</span>
    <noscript>Per usare Lulù attiva JavaScript nel browser.</noscript>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Funziona offline: service worker di Lulù (web/sw.js). Quello generato
    // da Flutter si disinstalla da solo e non è usato (web/flutter_bootstrap.js).
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('Service worker non registrato:', e);
        });
      });
    }
    // I dati stanno nel browser: chiede di non cancellarli quando manca
    // spazio (Safari e Chrome lo concedono di più alle app installate).
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
  </script>
</body>
</html>
